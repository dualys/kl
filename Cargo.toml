[package]
name = "kl"
version = "0.1.0"
edition = "2024"
description = "Distributed Kpack job execution engine over a 3D hypercube (Hamon Cube / 8 logical nodes)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dualys/kl"
keywords = ["hypercube", "kpack", "distributed", "merkle", "kl"]
categories = ["concurrency", "compression", "network-programming", "filesystem"]

[features]
default = ["std"]
std = []

[dependencies]
cubefs = "0.1.1"
heapless = "0.9.3"
jinshu = "0.1.0"
kpack = "0.1.0"
libc = "0.2"
noun = "0.1.0"
plans = "0.1.0"
wuu = "0.2.0"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
